<h1>{{ title }}</h1>

<div class="buscador-container">
  <div class="buscador">
    <label for="buscarId">Buscar por Id:</label>
    <input #buscarId id="buscarId" type="text" placeholder="Id del Juego">
    <button (click)="onBuscarId(buscarId.value)">Buscar</button>
  </div>

  <div class="buscador">
    <label for="buscarTitulo">Buscar por Título:</label>
    <input #buscarTitulo id="buscarTitulo" type="text" placeholder="Título del Juego">
    <button (click)="onBuscarTitulo(buscarTitulo.value)">Buscar</button>
  </div>
</div>

<div class="filtros-globales">
  <div class="filtro">
    <span>Género</span>
    <select #genreSelect class="filtro-select" 
            [disabled]="minPrice > 0 || maxPrice > 0" 
            (change)="onGenreChange(genreSelect.value)">
      <option value="">Todos</option>
      <option value="Action">Action</option>
      <option value="Adventure">Adventure</option>
      <option value="RPG">RPG</option>
      <option value="Racing">Racing</option>
      <option value="Simulation">Simulation</option>
      <option value="Sports">Sports</option>
      <option value="Strategy">Strategy</option>
    </select>
  </div>

  <div class="filtro">
    <span>Plataforma</span>
    <select #platformSelect class="filtro-select" 
            [disabled]="minPrice > 0 || maxPrice > 0" 
            (change)="onPlatformChange(platformSelect.value)">
      <option value="">Todas</option>
      <option value="PC">PC</option>
      <option value="PlayStation">PlayStation</option>
      <option value="Xbox">Xbox</option>
      <option value="Switch">Switch</option>
    </select>
  </div>

  <div class="filtro-precios">
    <span>Precio (€)</span>
    <div class="precio-inputs">
      <input #minPrecio type="number" placeholder="Mín" 
             [disabled]="selectedGenre !== '' || selectedPlatform !== ''">
      <span class="separador">-</span>
      <input #maxPrecio type="number" placeholder="Máx" 
             [disabled]="selectedGenre !== '' || selectedPlatform !== ''">
      <button [disabled]="selectedGenre !== '' || selectedPlatform !== ''" 
              (click)="onBuscarPrecio(minPrecio.value, maxPrecio.value)">
        Filtrar
      </button>
    </div>
  </div>
</div>

<div class="contenedor-tarjetas">
  @for (game of games; track game.id) {
  <div class="card">
    <h3>{{game.title}}</h3>
    <div>
      <p><b>Género:</b> {{ game.genre }}</p>
      <p><b>Plataforma:</b> {{ game.platform }}</p>
      <p><b>Precio:</b> {{ game.price }}€</p>
    </div>
  </div>
  } @empty {
  <span class="mensaje-vacio">No hay Juegos Cargados</span>
  }
</div>
